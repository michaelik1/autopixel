services:
  autpixel:
    build: .
    container_name: autpixel
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - HEADLESS=true
    volumes:
      - ./logs:/app/logs
      - ./.env:/app/.env
    # Resource limits for 2.5GB RAM / 2 CPU servers
    deploy:
      resources:
        limits:
          memory: 1536M
          cpus: "1.5"
        reservations:
          memory: 512M
    shm_size: "512m"  # Shared memory for Chrome headless (needs more for JS injection)
